name: 缺陷报告
description: 报告可复现的问题，帮助我们改进 Student OS。
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请勿在公开 Issue 中提交密钥、会话 Cookie、个人记录或其他敏感信息。
  - type: textarea
    id: summary
    attributes:
      label: 问题概述
      description: 请说明实际发生了什么。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开…
        2. 点击…
        3. 看到…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境信息
      placeholder: 浏览器、操作系统、提交版本或部署地址
